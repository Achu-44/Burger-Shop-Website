<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC-Burger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="navbar">
            <div class="logo">
                <img src="cravings-logo.jpg" alt="brand-logo">
            </div>
            <button class="toggle">
                 ☰
            </button>
            <div class="navlink">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#about">About</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="content">
        <div class="text-content">
            <p class="text">
                  Authentic flouvours<br>
                      Unforgettable moments !<br>     
            </p>
            <button class="menu">Explore Menu</button>
        </div>
        <div class="image-content">
            <img src="Burger with Crispy Fries.jpeg" alt="Burger-image">
        </div>
    </div>
    <div class="menu-section">
            <div class="menu-1">
                <img src="./Burger.jpeg" alt="Burger menu" class="burger-menu">
                <button class="burgers-button">
                    Burgers
                </button>
            </div>
            
            <div class="menu-1">
                <img src="./Broasted-chicken.jpeg" alt="broasted-chicken menu" class="broasted">
                <button class="broasted-button">
                    Broasted
                </button>
            </div>
    </div>
    <div class="response">
        <div class="description">
            <div class="freshness">
                <img src="./percetage.jpeg" alt="100-guarentie" class="fresh">
                <h1 class="quates">
                    100% FRESH
                </h1>
                <h4>
                    fresh ingredients<br>
                    In every serve
                </h4>
            </div>
            <div class="premium">
                <img src="./premium-quality.jpeg" alt="premium-quality-symbol" class="premium-quality">
                <h1 class="quates">
                    PREMIUM
                </h1>
                <h4>
                    quality ingredients in<br>
                    every product
                </h4>
            </div>
            <div class="order">
                <img src="./pre-order.jpg" alt="pre-order-symbol" class="pre-order">
                <h1 class="quates">
                    PRE-ORDER
                </h1>
                <h4>
                    Cooked Fresh When you<br>
                       order
                </h4>
            </div>
            <div class="hand-made">
                <img src="./hand-made.jpeg" alt="handmade-symbol" class="hand-symbol">
                <h1 class="quates">
                    HAND-MADE
                </h1>
                <h4>
                    Hand-pressed patty<br>
                    Crafted with Quality
                </h4>
            </div>
        </div>

    </div>
</body>
</html>
